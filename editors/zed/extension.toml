id = "delphi13"
name = "Delphi 13"
version = "0.2.0"
schema_version = 1
description = "Delphi 13 (Object Pascal) and DFM/FMX form support, powered by tree-sitter-delphi13 and tree-sitter-dfm."
repository = "https://github.com/Alexl-git/tree-sitter-delphi13"
authors = ["Alexander Liberov"]
languages = ["languages/delphi", "languages/dfm"]

# Zed fetches each grammar from GitHub at the pinned revision and compiles it to
# WASM itself. Both revisions below are pushed to origin/master.
#
# WHEN YOU RELEASE A NEW GRAMMAR VERSION: bump `rev` here, bump `version` above,
# then reinstall the dev extension. Zed caches compiled grammars by rev.

[grammars.delphi13]
repository = "https://github.com/Alexl-git/tree-sitter-delphi13"
rev = "a820b9ba045a6df48e83cc72139043096142e97c"

[grammars.dfm]
repository = "https://github.com/Alexl-git/tree-sitter-dfm"
rev = "3ef478383fdef4163ab60e06c7dceb4ac28187d4"
